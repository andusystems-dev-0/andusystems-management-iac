name: deploy-spoke-apps

# Apply (or re-apply) one — or all — of the spoke-cluster ArgoCD Application
# manifests on the management cluster. Each spoke has a wrapper playbook at
# ansible/configurations/roles/andusystems-<cluster>.yml that templates the
# matching apps/andusystems-<cluster>/manifest.yml into the management
# argocd namespace. ArgoCD then syncs the Applications to their target
# clusters (which must already be registered as destinations — see the
# register-clusters tag on the argocd role).
#
# Secrets come from HashiCorp Vault via GitHub OIDC — see
# scripts/vault-bootstrap.sh for the setup. The local plaintext vault file
# is gitignored and never present on the runner; every `vault_*` var the
# spoke roles need is fetched fresh from Vault per job and passed as `-e`
# overrides to ansible-playbook.
#
# Manual trigger only. No push trigger, since re-applying is a control-plane
# write into the management cluster's argocd ns and shouldn't fire on every
# commit.

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Which spoke-cluster apps to deploy'
        type: choice
        options:
          - all
          - andusystems-portfolio
          - andusystems-monitoring
          - andusystems-networking
          - andusystems-storage
          - andusystems-fleetdock
          - andusystems-hireship-sit
          - andusystems-hireship-prod
        required: true

concurrency:
  # Per-cluster serialization. `all` fans out to multiple jobs via matrix;
  # each job sets its own group below so they don't collide with single-
  # cluster dispatches of the same name.
  group: deploy-spoke-apps-${{ github.workflow }}-${{ inputs.cluster }}
  cancel-in-progress: false

# Required for hashicorp/vault-action JWT auth — GitHub mints a short-lived
# OIDC token per job that Vault verifies against the role we created in
# scripts/vault-bootstrap.sh.
permissions:
  id-token: write
  contents: read

jobs:
  # Expand `all` into the full list, otherwise emit a single-element matrix.
  # Doing this in a setup job keeps the matrix definition declarative.
  plan:
    runs-on: self-hosted-management-iac
    outputs:
      clusters: ${{ steps.plan.outputs.clusters }}
    steps:
      - id: plan
        env:
          CHOICE: ${{ inputs.cluster }}
        run: |
          if [[ "$CHOICE" == "all" ]]; then
            echo 'clusters=["andusystems-portfolio","andusystems-monitoring","andusystems-networking","andusystems-storage","andusystems-fleetdock","andusystems-hireship-sit","andusystems-hireship-prod"]' >> "$GITHUB_OUTPUT"
          else
            echo "clusters=[\"${CHOICE}\"]" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: plan
    runs-on: self-hosted-management-iac
    strategy:
      # Apply each spoke independently. One failing spoke doesn't block the
      # rest — operators usually want partial success visibility rather than
      # an all-or-nothing fan-out.
      fail-fast: false
      matrix:
        cluster: ${{ fromJSON(needs.plan.outputs.clusters) }}
    concurrency:
      group: deploy-spoke-apps-${{ github.workflow }}-${{ matrix.cluster }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ansible collections
        run: ansible-galaxy install -r ansible/requirements.yml

      - name: Fetch secrets from Vault (OIDC)
        # Wildcard pulls every field from secret/iac/management at once.
        # Each field becomes an env var prefixed by VAULT_ (uppercased).
        # The next step converts these into an ansible extra-vars YAML file
        # so adding a new secret doesn't need a workflow change.
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.andusystems.com
          method: jwt
          # Auth method is mounted at /auth/github-actions, not the default
          # /auth/jwt. scripts/vault-bootstrap.sh creates it there to keep
          # the mount name descriptive.
          path: github-actions
          role: management
          # Explicit so it always matches the role's bound_audiences regardless
          # of vault-action default changes between versions.
          jwtGithubAudience: https://github.com/andusystems-dev-0
          exportToken: false
          secrets: |
            secret/data/iac/management *

      - name: Build ansible extra-vars file from Vault env vars
        # vault-action's wildcard mode exports each field as its UPPERCASED
        # key name (the source keys already start with `vault_`, so they
        # surface as `VAULT_*`). Downcase to recover the original key and
        # write into a YAML extra-vars file ansible loads via -e @file.
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/vault-vars.yml"
          umask 077
          : > "$OUT"
          while IFS='=' read -r name value; do
            case "$name" in
              VAULT_*) ;;
              *) continue ;;
            esac
            key=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')
            esc=${value//\\/\\\\}
            esc=${esc//\"/\\\"}
            printf '%s: "%s"\n' "$key" "$esc" >> "$OUT"
          done < <(env)
          echo "wrote $(wc -l <"$OUT") keys to $OUT"
          echo "VAULT_VARS_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Run spoke-apps playbook
        # kubeconfig="" makes kubernetes.core fall back to the runner pod's
        # in-cluster ServiceAccount token, which has CRUD on
        # argoproj.io/applications via apps/github-runner/rbac.yml. Without
        # the empty override, ansible would template the vault's workstation
        # path (/home/admin/...) and fail trying to read it.
        # skip_spoke_bootstrap=true skips cross-cluster setup tasks (e.g.
        # the portfolio role's cluster-status proxy ConfigMap) that should
        # only run during initial workstation-driven spoke bootstrap.
        env:
          CLUSTER: ${{ matrix.cluster }}
        run: |
          ansible-playbook \
            -i ansible/inventory/management \
            "ansible/configurations/roles/${CLUSTER}.yml" \
            --tags install \
            -e "@${VAULT_VARS_FILE}" \
            -e "repo_root=${GITHUB_WORKSPACE}" \
            -e "vault_repo_root=${GITHUB_WORKSPACE}" \
            -e "apps_dir=${GITHUB_WORKSPACE}/apps" \
            -e 'kubeconfig=' \
            -e "skip_spoke_bootstrap=true"

      - name: Scrub secrets
        if: always()
        run: |
          rm -f "${VAULT_VARS_FILE:-/dev/null}" || true
