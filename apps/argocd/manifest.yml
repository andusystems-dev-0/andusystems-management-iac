---
#
# ArgoCD IngressRoute (HTTPS)
#
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-ingressroute
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`{{ argocd_url }}`) && PathPrefix(`/`)"
      kind: Rule
      middlewares:
        - name: argocd-headers
          namespace: argocd
      services:
        - name: argocd-server
          port: 80
          namespace: argocd
  tls:
    secretName: argocd-tls
---
#
# ArgoCD IngressRoute (HTTP → HTTPS redirect)
#
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-ingressroute-http
  namespace: argocd
spec:
  entryPoints:
    - web
  routes:
    - match: "Host(`{{ argocd_url }}`) && PathPrefix(`/`)"
      kind: Rule
      middlewares:
        - name: redirect-to-https
          namespace: argocd
      services:
        - name: argocd-server
          port: 80
          namespace: argocd
---
#
# HTTPS redirect middleware
#
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: argocd
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
#
# Headers middleware
#
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: argocd-headers
  namespace: argocd
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
#
# TLS Certificate via cert-manager
#
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-tls
  namespace: argocd
spec:
  secretName: argocd-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "{{ argocd_url }}"
