---
#
# Longhorn Storage
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-longhorn
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.7.3
      helm:
        valueFiles:
          - $values/apps/longhorn/values.yml
    - repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/andusystems/andusystems-monitoring.git
      targetRevision: HEAD
      ref: values
  destination:
    name: andusystems-monitoring
    namespace: longhorn-system
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/preserveUnknownFields
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
---
#
# Homepage Application
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-homepage
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://jameswynn.github.io/helm-charts
      chart: homepage
      targetRevision: 2.1.0
      helm:
        valueFiles:
          - $values/apps/homepage/values.yml
        values: |
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "localhost,127.0.0.1,{{ homepage_url }}"
    - repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/andusystems/andusystems-monitoring.git
      targetRevision: HEAD
      path: apps/homepage
      directory:
        include: '{manifest.yml}'
    - repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/andusystems/andusystems-monitoring.git
      targetRevision: HEAD
      ref: values
  destination:
    name: andusystems-monitoring
    namespace: homepage
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
