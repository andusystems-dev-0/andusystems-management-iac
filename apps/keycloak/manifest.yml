apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-keycloak
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://codecentric.github.io/helm-charts
      chart: keycloakx
      targetRevision: 2.5.0
      helm:
        valueFiles:
          - $values/apps/keycloak/values.yml
    - repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/andusystems/andusystems-management.git
      targetRevision: HEAD
      ref: values
  destination:
    name: in-cluster
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak-ingressroute
  namespace: keycloak
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`{{ keycloak_url }}`) && PathPrefix(`/`)"
      kind: Rule
      middlewares:
        - name: keycloak-headers
          namespace: keycloak
      services:
        - name: management-keycloak-keycloakx-http
          port: 80
          namespace: keycloak
  tls:
    secretName: keycloak-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak-ingressroute-http
  namespace: keycloak
spec:
  entryPoints:
    - web
  routes:
    - match: "Host(`{{ keycloak_url }}`) && PathPrefix(`/`)"
      kind: Rule
      middlewares:
        - name: redirect-to-https
          namespace: keycloak
      services:
        - name: management-keycloak-keycloakx-http
          port: 80
          namespace: keycloak
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: keycloak
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-headers
  namespace: keycloak
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: keycloak
spec:
  secretName: keycloak-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "{{ keycloak_url }}"
