replicas: 1

command:
  - "/opt/keycloak/bin/kc.sh"
  - "start"
  - "--http-enabled=true"
  - "--http-port=8080"
  - "--hostname=https://keycloak.andusystems.com"
  - "--proxy-headers=xforwarded"
  - "--cache=local"
  - "--import-realm"

extraVolumes: |
  - name: realm-import
    configMap:
      name: keycloak-realm-import

extraVolumeMounts: |
  - name: realm-import
    mountPath: /opt/keycloak/data/import
    readOnly: true

extraEnv: |
  - name: KEYCLOAK_ADMIN
    valueFrom:
      secretKeyRef:
        name: keycloak-admin-secret
        key: username
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin-secret
        key: password
  - name: KC_PROXY_HEADERS
    value: "xforwarded"
  - name: KC_HOSTNAME
    value: "https://keycloak.andusystems.com"
  - name: KC_DB
    value: "dev-file"
  - name: KC_CACHE
    value: "local"
  - name: KC_SPI_IMPORT_IMPORTER
    value: "dir"
  - name: KC_SPI_IMPORT_DIR_DIR
    value: "/opt/keycloak/data/import"
  - name: KC_SPI_IMPORT_DIR_STRATEGY
    value: "OVERWRITE_EXISTING"

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1Gi

service:
  type: ClusterIP
  httpPort: 80

http:
  relativePath: "/"
