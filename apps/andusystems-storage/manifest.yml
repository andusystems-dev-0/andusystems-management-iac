---
#
# Traefik application
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-traefik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.traefik.io/traefik
      chart: traefik
      targetRevision: 32.1.1   # latest stable as of early 2026
      helm:
        valueFiles:
          - $values/apps/traefik/values.yml
        values: |
          service:
            type: LoadBalancer
            additionalServices: {}
            annotations:
              metallb.io/address-pool: default
              metallb.io/loadBalancerIPs: "{{ storage_traefik_server_ip }}"
    - repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/andusystems/andusystems-storage.git
      targetRevision: HEAD
      ref: values
  destination:
    name: andusystems-storage
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-cert-manager
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.14.4
      helm:
        valueFiles:
          - $values/apps/cert-manager/values.yml
    - repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/andusystems/andusystems-storage.git
      targetRevision: HEAD
      ref: values
  destination:
    name: andusystems-storage
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true    # ← likely missing
      - RespectIgnoreDifferences=true
    managedNamespaceMetadata: {}
