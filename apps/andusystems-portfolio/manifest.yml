---
#
# Traefik application
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-traefik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.traefik.io/traefik
      chart: traefik
      targetRevision: 32.1.1
      helm:
        valueFiles:
          - $values/apps/traefik/values.yml
        values: |
          service:
            type: LoadBalancer
            additionalServices: {}
            annotations:
              metallb.io/address-pool: default
              metallb.io/loadBalancerIPs: "{{ portfolio_traefik_server_ip }}"
    - repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/andusystems/andusystems-portfolio.git
      targetRevision: HEAD
      ref: values
  destination:
    name: andusystems-portfolio
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
