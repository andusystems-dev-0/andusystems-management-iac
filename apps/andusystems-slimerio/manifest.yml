---
#
# Longhorn Storage
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slimerio-longhorn
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.7.3
      helm:
        valueFiles:
          - $values/apps/longhorn/values.yml
    - repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/andusystems/andusystems-slimerio.git
      targetRevision: HEAD
      ref: values
  destination:
    name: andusystems-slimerio
    namespace: longhorn-system
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/preserveUnknownFields
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
