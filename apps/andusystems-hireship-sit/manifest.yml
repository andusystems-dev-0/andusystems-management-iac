---
# Hireship app (plain manifests from Forgejo apps/hireship-sit).
# Excludes the three Jinja2-templated bootstrap secrets — they're applied by
# ansible/configurations/roles/hireship before this Application syncs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hireship-sit-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/andusystems/andusystems-hireship.git
    targetRevision: HEAD
    path: apps/hireship-sit
    directory:
      recurse: false
      # Skip Ansible-templated bootstrap secrets — invalid plain YAML.
      exclude: '{registry-secret.yml,secrets.yml,postgres-secret.yml}'
  destination:
    name: andusystems-hireship-sit
    namespace: hireship
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
