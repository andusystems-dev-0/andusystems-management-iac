---
# ============================================================================
# ArgoCD Applications targeting the andusystems-hireship-sit spoke cluster.
#
# Sourced from andusystems-hireship on the cluster-internal Forgejo URL. The
# cluster destination name `andusystems-hireship-sit` must be registered with
# ArgoCD first (see ansible/configurations/roles/argocd/tasks/register-clusters.yml).
#
# Mirrors apps/andusystems-portfolio/manifest.yml; if you add a new infra
# chart there, add it here too (and to the prod manifest).
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hireship-sit-traefik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.traefik.io/traefik
      chart: traefik
      targetRevision: 32.1.1
      helm:
        valueFiles:
          - $values/apps/traefik/values.yml
        values: |
          service:
            type: LoadBalancer
            additionalServices: {}
            annotations:
              metallb.io/address-pool: default
              metallb.io/loadBalancerIPs: "{{ hireship_sit_traefik_server_ip }}"
    - repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/andusystems/andusystems-hireship.git
      targetRevision: HEAD
      ref: values
  destination:
    name: andusystems-hireship-sit
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
