- name: Login to ArgoCD
  shell: |
    argocd login {{ argocd_server_ip }} \
      --username admin \
      --password {{ argocd_admin_password | quote }} \
      --insecure \
      --plaintext
  register: login_result
  changed_when: "'logged in successfully' in login_result.stdout"
  until: login_result.rc == 0
  retries: 5
  delay: 10
  environment:
    ARGOCD_OPTS: "--grpc-web"
  no_log: true

# Install FleetDock cluster apps
- name: install | Install FleetDock Cluster Apps
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', repo_root + '/apps/andusystems-fleetdock/manifest.yml') | from_yaml_all | list }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"