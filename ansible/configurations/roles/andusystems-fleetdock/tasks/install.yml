- name: Login to ArgoCD
  # Use --password-stdin so the password never lands on the command line
  # (no_log no longer needed, which means task errors actually surface
  # instead of being censored).
  ansible.builtin.command:
    cmd: argocd login {{ argocd_server_ip }} --username admin --password-stdin --insecure --plaintext
    stdin: "{{ argocd_admin_password }}"
  register: login_result
  changed_when: "'logged in successfully' in login_result.stdout"
  until: login_result.rc == 0
  retries: 5
  delay: 10
  environment:
    ARGOCD_OPTS: "--grpc-web"

# Install FleetDock cluster apps
- name: install | Install FleetDock Cluster Apps
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', repo_root + '/apps/andusystems-fleetdock/manifest.yml') | from_yaml_all | list }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"