---
- name: Apply GitHub Runner manifests (namespaces + PAT secret)
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', repo_root + '/apps/github-runner/manifest.yml') | from_yaml_all | list }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

- name: Install ARC controller
  command: >
    helm upgrade --install arc
    oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
    --namespace arc-systems
    --values {{ repo_root }}/apps/github-runner/values-controller.yml
    --wait
    --timeout 300s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: arc_controller_helm
  changed_when: "'has been upgraded' in arc_controller_helm.stdout or 'has been installed' in arc_controller_helm.stdout"

- name: Wait for ARC controller to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: arc-systems
    label_selectors:
      - app.kubernetes.io/name=gha-rs-controller
  register: arc_controller
  until: arc_controller.resources | length > 0 and (arc_controller.resources[0].status.readyReplicas | default(0)) > 0
  retries: 30
  delay: 10
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

# Each repo gets its own scale set bound to the repo's GitHub URL. All four
# share the `self-hosted` runner label (workflows don't need to know which
# scale set picked them up — GitHub matches jobs to runners by URL scope).
# Helm release names MUST be distinct; that's the per-scale-set identity.
#
# Values files are rendered as Jinja2 templates so cross-cluster IPs (e.g.
# storage_traefik_server_ip in hostAliases) come from the management vault
# rather than being hardcoded. Helm does NOT process Jinja2 in --values
# arguments, so each is rendered to a tempfile first.
- name: Render runner values for each repo
  template:
    src: "{{ repo_root }}/apps/github-runner/{{ item.values_file }}"
    dest: "/tmp/arc-runner-values-{{ item.release }}.yml"
    mode: "0600"
  loop: "{{ runner_scale_sets }}"
  loop_control:
    label: "{{ item.release }}"
  changed_when: false

- name: Install runner scale sets
  command: >
    helm upgrade --install {{ item.release }}
    oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
    --namespace arc-runners
    --values /tmp/arc-runner-values-{{ item.release }}.yml
    --set githubConfigUrl={{ item.github_url }}
    --wait
    --timeout 300s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  loop: "{{ runner_scale_sets }}"
  loop_control:
    label: "{{ item.release }}"
  register: arc_runner_helm
  changed_when: "'has been upgraded' in arc_runner_helm.stdout or 'has been installed' in arc_runner_helm.stdout"
