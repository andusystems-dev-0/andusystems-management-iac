- name: Login to ArgoCD
  shell: |
    argocd login {{ argocd_server_ip }} \
      --username admin \
      --password {{ argocd_admin_password | quote }} \
      --insecure \
      --plaintext
  register: login_result
  changed_when: "'logged in successfully' in login_result.stdout"
  until: login_result.rc == 0
  retries: 5
  delay: 10
  environment:
    ARGOCD_OPTS: "--grpc-web"
  no_log: true
  
# Install Traefik
- name: install | Install Traefik Manifest
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', repo_root + '/apps/traefik/manifest.yml') | from_yaml_all | list }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

- name: Kick off Traefik ArgoCD app sync (async)
  command: argocd app sync management-traefik --async
  register: sync_result
  changed_when: true
  retries: 3
  delay: 10
  until: sync_result.rc == 0

- name: Wait for Traefik ArgoCD app to be synced and healthy
  command: argocd app wait management-traefik --sync --health --timeout 600
  register: wait_result
  changed_when: false

- name: Wait for Traefik CRDs to be registered
  command: kubectl get crd {{ item }}
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: crd_check
  retries: 30
  delay: 10
  until: crd_check.rc == 0
  changed_when: false
  loop:
    - ingressroutes.traefik.io
    - middlewares.traefik.io