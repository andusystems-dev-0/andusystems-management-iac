- name: Login to ArgoCD
  shell: |
    argocd login {{ argocd_server_ip }} \
      --username admin \
      --password {{ argocd_admin_password | quote }} \
      --insecure \
      --plaintext
  register: login_result
  changed_when: "'logged in successfully' in login_result.stdout"
  until: login_result.rc == 0
  retries: 5
  delay: 10
  environment:
    ARGOCD_OPTS: "--grpc-web"
  no_log: true
  
# Install Traefik
- name: install | Install Traefik Manifest
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', repo_root + '/apps/traefik/manifest.yml') | from_yaml_all | list }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

- name: Sync Traefik ArgoCD app (synchronous, retried)
  # Synchronous sync so we know it completed before we check health.
  # `argocd app sync` returns non-zero on transient sync failures (CRD
  # validation flapping while hub.traefik.io CRDs stabilise, Degraded
  # transitions, etc.) — retries cover that.
  command: argocd app sync management-traefik --timeout 600
  register: sync_result
  changed_when: "'OutOfSync' not in sync_result.stdout or 'Synced' in sync_result.stdout"
  retries: 5
  delay: 15
  until: sync_result.rc == 0

# Health check decoupled from sync: poll until the Traefik Deployment
# is Available. `argocd app wait --health` fail-fasts on Missing→Degraded
# transitions, which fires before pods finish rolling out. The
# Deployment's Available condition is the actual source of truth.
- name: Wait for Traefik Deployment to be Available
  command: >
    kubectl -n traefik wait deployment/management-traefik
    --for=condition=Available --timeout=600s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false

- name: Wait for Traefik CRDs to be registered
  command: kubectl get crd {{ item }}
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: crd_check
  retries: 30
  delay: 10
  until: crd_check.rc == 0
  changed_when: false
  loop:
    - ingressroutes.traefik.io
    - middlewares.traefik.io