- name: Login to ArgoCD
  shell: |
    argocd login {{ argocd_server_ip }} \
      --username admin \
      --password {{ argocd_admin_password | quote }} \
      --insecure \
      --plaintext
  register: login_result
  changed_when: "'logged in successfully' in login_result.stdout"
  until: login_result.rc == 0
  retries: 5
  delay: 10
  environment:
    ARGOCD_OPTS: "--grpc-web"
  no_log: true

- name: Create vault namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: vault
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

- name: install | Install Vault Manifest
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', repo_root + '/apps/vault/manifest.yml') | from_yaml_all | list }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
