---
# --- Terraform: Install Helm Charts ---
- name: Terraform destroy (layer-2-helmapps)
  community.general.terraform:
    project_path: "{{ repo_root }}/terraform/layers/layer-2-helmapps"
    variables_files:
      - "{{ repo_root }}/terraform/terraform.tfvars"
    state: absent
    force_init: true
  register: tf_destroy
  retries: 5
  delay: 15
  until: tf_destroy is not failed
  ignore_errors: true

- name: Terraform apply (layer-2-helmapps)
  community.general.terraform:
    project_path: "{{ repo_root }}/terraform/layers/layer-2-helmapps"
    variables_files:
      - "{{ repo_root }}/terraform/terraform.tfvars"
    state: present
    force_init: true
  register: tf_apply
  retries: 2
  delay: 10
  until: tf_apply is not failed
  ignore_errors: true

- name: install | Install Metallb Manifest
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', repo_root + '/apps/metallb/manifest.yml') | from_yaml_all | list }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

# Wait for ArgoCD namespace and pods to be ready
- name: Wait for ArgoCD namespace
  kubernetes.core.k8s_info:
    kind: Namespace
    name: argocd
    wait: true
    wait_timeout: 60
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"
  register: namespace_check
  retries: 10
  delay: 6
  until: namespace_check.resources | length > 0

- name: Wait for ArgoCD server pod
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: argocd
    label_selectors:
      - app.kubernetes.io/name=argocd-server
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 300
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"
  register: pod_check
  retries: 30
  delay: 10
  until: pod_check.resources | length > 0 and pod_check.resources[0].status.phase == "Running"

- name: Wait for ArgoCD service
  kubernetes.core.k8s_info:
    kind: Service
    namespace: argocd
    name: argocd-server
    wait: true
    wait_timeout: 60
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"

- name: Patch ArgoCD service to LoadBalancer with pinned MetalLB IP
  # PIN the LoadBalancer IP via MetalLB annotations to whatever is in
  # vault_argocd_server_ip. Without this pin, MetalLB picks the next free
  # IP from the default pool every redeploy and the assigned IP can drift
  # away from what the vault var thinks. The drift silently breaks every
  # downstream `argocd login {{ argocd_server_ip }}` call (traefik,
  # forgejo, keycloak, vault, andusystems-* roles), making `apps.sh`
  # unusable until someone notices and updates the vault by hand.
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-server
        namespace: argocd
        annotations:
          metallb.io/address-pool: default
          metallb.io/loadBalancerIPs: "{{ argocd_server_ip }}"
      spec:
        type: LoadBalancer
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"

- name: Wait for LoadBalancer IP assignment
  kubernetes.core.k8s_info:
    kind: Service
    namespace: argocd
    name: argocd-server
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"
  register: argocd_service
  retries: 30
  delay: 5
  until: >-
    argocd_service.resources[0].status.loadBalancer.ingress is defined and
    argocd_service.resources[0].status.loadBalancer.ingress | length > 0

- name: Set ArgoCD server IP fact
  set_fact:
    argocd_server_ip: "{{ argocd_service.resources[0].status.loadBalancer.ingress[0].ip }}"

- name: Assert ArgoCD server IP is defined
  assert:
    that: argocd_server_ip is defined and argocd_server_ip | length > 0
    fail_msg: "LoadBalancer IP not yet assigned to argocd-server. Check MetalLB and retry."

- name: Wait for ArgoCD API to be responsive
  uri:
    url: "http://{{ argocd_server_ip }}"
    validate_certs: false
    method: HEAD
  register: api_check
  until: api_check.status == 200
  retries: 30
  delay: 5
  ignore_errors: true

- name: Get ArgoCD initial admin secret (may be absent on re-runs)
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: argocd
    name: argocd-initial-admin-secret
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"
  register: secret_info

- name: Decode initial ArgoCD password
  set_fact:
    argocd_initial_password: "{{ secret_info.resources[0].data.password | b64decode }}"
  when: secret_info.resources | length > 0
  no_log: true

# Install ArgoCD CLI if not present
- name: Check if argocd CLI is installed
  command: which argocd
  register: argocd_cli_check
  ignore_errors: true
  changed_when: false

- name: Download and install argocd CLI
  get_url:
    url: https://github.com/argoproj/argo-cd/releases/download/v2.12.0/argocd-linux-amd64
    dest: /usr/local/bin/argocd
    mode: '0755'
  when: argocd_cli_check.rc != 0

# --- Log in with fallback: try initial-secret password, then vault password ---
- name: Try login with initial-secret ArgoCD password
  shell: |
    argocd login {{ argocd_server_ip }} \
      --username admin \
      --password {{ argocd_initial_password | quote }} \
      --insecure \
      --plaintext
  register: initial_login
  failed_when: false
  changed_when: "'logged in successfully' in initial_login.stdout"
  environment:
    ARGOCD_OPTS: "--grpc-web"
  when: argocd_initial_password is defined
  no_log: true

- name: Try login with vault ArgoCD password (fallback for re-runs)
  shell: |
    argocd login {{ argocd_server_ip }} \
      --username admin \
      --password {{ argocd_admin_password | quote }} \
      --insecure \
      --plaintext
  register: vault_login
  failed_when: false
  changed_when: "'logged in successfully' in vault_login.stdout"
  until: vault_login.rc == 0
  retries: 5
  delay: 10
  environment:
    ARGOCD_OPTS: "--grpc-web"
  when: (initial_login.rc | default(1)) != 0
  no_log: true

- name: Record which ArgoCD password is active
  set_fact:
    argocd_initial_password_active: "{{ (initial_login.rc | default(1)) == 0 }}"
    login_result:
      rc: 0
  when: (initial_login.rc | default(1)) == 0 or (vault_login.rc | default(1)) == 0

- name: Fail if neither ArgoCD password worked
  fail:
    msg: "Could not log in to ArgoCD with either the initial-secret password or vault argocd_admin_password"
  when: login_result is not defined

# Note: The Forgejo management repo is registered later by the forgejo role
# using the cluster-internal URL (forgejo-http.forgejo.svc.cluster.local:3000),
# which avoids the TLS/cert-manager chicken-and-egg on a fresh deploy.

# NOTE: The slimerio repo is registered by the forgejo role
# (ansible/configurations/roles/forgejo/tasks/install.yml) along with all the
# other Forgejo IaC repos, using the cluster-internal Forgejo URL. The previous
# `argocd repo add git@github.com:...` registration was removed because it
# duplicated the same logical repo with a GitHub SSH URL — drifting between
# Forgejo (canonical) and GitHub (sanitized mirror) is a known source of
# corruption, so the entire ArgoCD setup pulls from Forgejo only.

# Register slimerio cluster
- name: Check if slimerio cluster is already registered
  shell: argocd cluster get andusystems-slimerio
  register: cluster_check
  failed_when: false
  changed_when: false
  when: login_result.rc == 0

- name: Get contexts from slimerio kubeconfig
  shell: |
    KUBECONFIG={{ slimerio_kubeconfig }} kubectl config get-contexts -o name
  register: kubecontexts
  changed_when: false
  when:
    - login_result.rc == 0
    - cluster_check.rc != 0

- name: Add slimerio cluster to ArgoCD
  shell: |
    argocd cluster add {{ kubecontexts.stdout_lines[0] }} \
      --kubeconfig {{ slimerio_kubeconfig }} \
      --name andusystems-slimerio \
      --system-namespace kube-system \
      --insecure \
      --upsert \
      --yes
  register: cluster_add_result
  changed_when: "'added' in cluster_add_result.stdout"
  when:
    - login_result.rc == 0
    - cluster_check.rc != 0
    - kubecontexts.stdout_lines | length > 0
  no_log: true

- name: Label slimerio cluster secret for ApplicationSet generator
  shell: |
    SECRET_NAME=$(kubectl -n argocd get secrets \
      -l argocd.argoproj.io/secret-type=cluster \
      -o jsonpath='{.items[?(@.data.name=="YW5kdXN5c3RlbXMtc2xpbWVyaW8=")].metadata.name}')
    if [ -z "$SECRET_NAME" ]; then
      echo "ERROR: Could not find cluster secret"
      exit 1
    fi
    kubectl -n argocd label secret "$SECRET_NAME" \
      type=andusystems-slimerio \
      region=us \
      --overwrite
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"
  when:
    - login_result.rc == 0
    - cluster_add_result is defined

# Register storage cluster
# The storage repo is hosted on the cluster-internal Forgejo URL
# (http://forgejo-http.forgejo.svc.cluster.local:3000/...) so no explicit
# `argocd repo add` is needed — ArgoCD pulls anonymously over HTTP.
- name: Check if storage cluster is already registered
  shell: argocd cluster get andusystems-storage
  register: storage_cluster_check
  failed_when: false
  changed_when: false
  when: login_result.rc == 0

- name: Get contexts from storage kubeconfig
  shell: |
    KUBECONFIG={{ storage_kubeconfig }} kubectl config get-contexts -o name
  register: storage_kubecontexts
  changed_when: false
  when:
    - login_result.rc == 0
    - storage_cluster_check.rc != 0

- name: Add storage cluster to ArgoCD
  shell: |
    argocd cluster add {{ storage_kubecontexts.stdout_lines[0] }} \
      --kubeconfig {{ storage_kubeconfig }} \
      --name andusystems-storage \
      --system-namespace kube-system \
      --insecure \
      --upsert \
      --yes
  register: storage_cluster_add_result
  changed_when: "'added' in storage_cluster_add_result.stdout"
  when:
    - login_result.rc == 0
    - storage_cluster_check.rc != 0
    - storage_kubecontexts.stdout_lines | length > 0
  no_log: true

- name: Label storage cluster secret for ApplicationSet generator
  shell: |
    SECRET_NAME=$(kubectl -n argocd get secrets \
      -l argocd.argoproj.io/secret-type=cluster \
      -o jsonpath='{.items[?(@.data.name=="YW5kdXN5c3RlbXMtc3RvcmFnZQ==")].metadata.name}')
    if [ -z "$SECRET_NAME" ]; then
      echo "ERROR: Could not find storage cluster secret"
      exit 1
    fi
    kubectl -n argocd label secret "$SECRET_NAME" \
      type=andusystems-storage \
      region=us \
      --overwrite
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"
  when:
    - login_result.rc == 0
    - storage_cluster_add_result is defined

# Register portfolio cluster
# The portfolio repo is hosted on the cluster-internal Forgejo URL
# (http://forgejo-http.forgejo.svc.cluster.local:3000/...) so no explicit
# `argocd repo add` is needed beyond the one performed by the forgejo role.
- name: Check if portfolio cluster is already registered
  shell: argocd cluster get andusystems-portfolio
  register: portfolio_cluster_check
  failed_when: false
  changed_when: false
  when: login_result.rc == 0

# Stat the portfolio kubeconfig BEFORE attempting to read contexts. kubectl
# `config get-contexts` against a missing kubeconfig path silently returns
# exit 0 with empty stdout, which would let the cluster-add step skip without
# raising — and the downstream label step would then fire against a secret
# that doesn't exist. Fail loud and early instead.
- name: Stat portfolio kubeconfig
  stat:
    path: "{{ portfolio_kubeconfig }}"
  register: portfolio_kubeconfig_stat
  when:
    - login_result.rc == 0
    - portfolio_cluster_check.rc != 0

- name: Fail if portfolio kubeconfig is missing
  fail:
    msg: |
      portfolio_kubeconfig points at {{ portfolio_kubeconfig }} but no file
      exists at that path. The portfolio cluster must be bootstrapped first
      via the andusystems-portfolio repo's portfolio.yml playbook (which
      generates the kubeconfig at the end of its kubernetes role) before the
      management ArgoCD can register it as a destination.
  when:
    - login_result.rc == 0
    - portfolio_cluster_check.rc != 0
    - not portfolio_kubeconfig_stat.stat.exists

- name: Get contexts from portfolio kubeconfig
  shell: |
    KUBECONFIG={{ portfolio_kubeconfig }} kubectl config get-contexts -o name
  register: portfolio_kubecontexts
  changed_when: false
  when:
    - login_result.rc == 0
    - portfolio_cluster_check.rc != 0

- name: Add portfolio cluster to ArgoCD
  shell: |
    argocd cluster add {{ portfolio_kubecontexts.stdout_lines[0] }} \
      --kubeconfig {{ portfolio_kubeconfig }} \
      --name andusystems-portfolio \
      --system-namespace kube-system \
      --insecure \
      --upsert \
      --yes
  register: portfolio_cluster_add_result
  changed_when: "'added' in portfolio_cluster_add_result.stdout"
  when:
    - login_result.rc == 0
    - portfolio_cluster_check.rc != 0
    - portfolio_kubecontexts.stdout_lines | length > 0
  no_log: true

- name: Label portfolio cluster secret for ApplicationSet generator
  shell: |
    SECRET_NAME=$(kubectl -n argocd get secrets \
      -l argocd.argoproj.io/secret-type=cluster \
      -o jsonpath='{.items[?(@.data.name=="YW5kdXN5c3RlbXMtcG9ydGZvbGlv")].metadata.name}')
    if [ -z "$SECRET_NAME" ]; then
      echo "ERROR: Could not find portfolio cluster secret"
      exit 1
    fi
    kubectl -n argocd label secret "$SECRET_NAME" \
      type=andusystems-portfolio \
      region=us \
      --overwrite
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"
  # Only label if we actually ran (and succeeded) the cluster-add. A
  # `skipped` task still satisfies `is defined`, which is what bit us
  # before the stat-and-fail guard above.
  when:
    - login_result.rc == 0
    - portfolio_cluster_add_result is defined
    - not (portfolio_cluster_add_result.skipped | default(false))

# Register monitoring cluster
# The monitoring repo is hosted on the cluster-internal Forgejo URL and is
# registered by the forgejo role. Without this cluster registration, every
# `monitoring-*` Application in ArgoCD reports Unknown sync/health because
# its `destination.name: andusystems-monitoring` resolves to no cluster
# secret — see the slimerio/storage/portfolio blocks above for the same
# pattern.
- name: Check if monitoring cluster is already registered
  shell: argocd cluster get andusystems-monitoring
  register: monitoring_cluster_check
  failed_when: false
  changed_when: false
  when: login_result.rc == 0

- name: Stat monitoring kubeconfig
  stat:
    path: "{{ monitoring_kubeconfig }}"
  register: monitoring_kubeconfig_stat
  when:
    - login_result.rc == 0
    - monitoring_cluster_check.rc != 0

- name: Fail if monitoring kubeconfig is missing
  fail:
    msg: |
      monitoring_kubeconfig points at {{ monitoring_kubeconfig }} but no file
      exists at that path. The monitoring cluster must be bootstrapped first
      via the andusystems-monitoring repo (whose kubernetes role generates
      the kubeconfig at the end of cluster init) before the management
      ArgoCD can register it as a destination.
  when:
    - login_result.rc == 0
    - monitoring_cluster_check.rc != 0
    - not monitoring_kubeconfig_stat.stat.exists

- name: Get contexts from monitoring kubeconfig
  shell: |
    KUBECONFIG={{ monitoring_kubeconfig }} kubectl config get-contexts -o name
  register: monitoring_kubecontexts
  changed_when: false
  when:
    - login_result.rc == 0
    - monitoring_cluster_check.rc != 0

- name: Add monitoring cluster to ArgoCD
  shell: |
    argocd cluster add {{ monitoring_kubecontexts.stdout_lines[0] }} \
      --kubeconfig {{ monitoring_kubeconfig }} \
      --name andusystems-monitoring \
      --system-namespace kube-system \
      --insecure \
      --upsert \
      --yes
  register: monitoring_cluster_add_result
  changed_when: "'added' in monitoring_cluster_add_result.stdout"
  when:
    - login_result.rc == 0
    - monitoring_cluster_check.rc != 0
    - monitoring_kubecontexts.stdout_lines | length > 0
  no_log: true

- name: Label monitoring cluster secret for ApplicationSet generator
  shell: |
    SECRET_NAME=$(kubectl -n argocd get secrets \
      -l argocd.argoproj.io/secret-type=cluster \
      -o jsonpath='{.items[?(@.data.name=="YW5kdXN5c3RlbXMtbW9uaXRvcmluZw==")].metadata.name}')
    if [ -z "$SECRET_NAME" ]; then
      echo "ERROR: Could not find monitoring cluster secret"
      exit 1
    fi
    kubectl -n argocd label secret "$SECRET_NAME" \
      type=andusystems-monitoring \
      region=us \
      --overwrite
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"
  when:
    - login_result.rc == 0
    - monitoring_cluster_add_result is defined
    - not (monitoring_cluster_add_result.skipped | default(false))

# Register networking cluster
# Same pattern as monitoring/slimerio/storage/portfolio. Without this,
# every `networking-*` Application reports Unknown sync/health because
# its `destination.name: andusystems-networking` resolves to no cluster
# secret. The networking IaC repo is registered separately by the forgejo
# role on the cluster-internal Forgejo URL.
- name: Check if networking cluster is already registered
  shell: argocd cluster get andusystems-networking
  register: networking_cluster_check
  failed_when: false
  changed_when: false
  when: login_result.rc == 0

- name: Stat networking kubeconfig
  stat:
    path: "{{ networking_kubeconfig }}"
  register: networking_kubeconfig_stat
  when:
    - login_result.rc == 0
    - networking_cluster_check.rc != 0

- name: Fail if networking kubeconfig is missing
  fail:
    msg: |
      networking_kubeconfig points at {{ networking_kubeconfig }} but no file
      exists at that path. The networking cluster must be bootstrapped first
      via the andusystems-networking repo (whose kubernetes role generates
      the kubeconfig at the end of cluster init) before the management
      ArgoCD can register it as a destination.
  when:
    - login_result.rc == 0
    - networking_cluster_check.rc != 0
    - not networking_kubeconfig_stat.stat.exists

- name: Get contexts from networking kubeconfig
  shell: |
    KUBECONFIG={{ networking_kubeconfig }} kubectl config get-contexts -o name
  register: networking_kubecontexts
  changed_when: false
  when:
    - login_result.rc == 0
    - networking_cluster_check.rc != 0

- name: Add networking cluster to ArgoCD
  shell: |
    argocd cluster add {{ networking_kubecontexts.stdout_lines[0] }} \
      --kubeconfig {{ networking_kubeconfig }} \
      --name andusystems-networking \
      --system-namespace kube-system \
      --insecure \
      --upsert \
      --yes
  register: networking_cluster_add_result
  changed_when: "'added' in networking_cluster_add_result.stdout"
  when:
    - login_result.rc == 0
    - networking_cluster_check.rc != 0
    - networking_kubecontexts.stdout_lines | length > 0
  no_log: true

- name: Label networking cluster secret for ApplicationSet generator
  shell: |
    SECRET_NAME=$(kubectl -n argocd get secrets \
      -l argocd.argoproj.io/secret-type=cluster \
      -o jsonpath='{.items[?(@.data.name=="YW5kdXN5c3RlbXMtbmV0d29ya2luZw==")].metadata.name}')
    if [ -z "$SECRET_NAME" ]; then
      echo "ERROR: Could not find networking cluster secret"
      exit 1
    fi
    kubectl -n argocd label secret "$SECRET_NAME" \
      type=andusystems-networking \
      region=us \
      --overwrite
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"
  when:
    - login_result.rc == 0
    - networking_cluster_add_result is defined
    - not (networking_cluster_add_result.skipped | default(false))

- name: Verify cluster was added
  shell: argocd cluster list
  register: cluster_list
  changed_when: false
  when: login_result.rc == 0

- name: Display registered clusters
  debug:
    var: cluster_list.stdout_lines
  when: login_result.rc == 0

# TODO: Re-enable other repo/cluster registrations when remotes are set up
# Repos: management, fleetdock
# Clusters: fleetdock
