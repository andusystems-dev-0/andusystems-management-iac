---
# --- Terraform: Install Helm Charts ---
- name: Terraform destroy (layer-2-helmapps)
  community.general.terraform:
    project_path: "{{ repo_root }}/terraform/layers/layer-2-helmapps"
    variables_files:
      - "{{ repo_root }}/terraform/terraform.tfvars"
    state: absent
    force_init: true
  register: tf_destroy
  retries: 5
  delay: 15
  until: tf_destroy is not failed
  ignore_errors: true

- name: Terraform apply (layer-2-helmapps)
  community.general.terraform:
    project_path: "{{ repo_root }}/terraform/layers/layer-2-helmapps"
    variables_files:
      - "{{ repo_root }}/terraform/terraform.tfvars"
    state: present
    force_init: true
  register: tf_apply
  retries: 2
  delay: 10
  until: tf_apply is not failed
  ignore_errors: true

- name: install | Install Metallb Manifest
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', repo_root + '/apps/metallb/manifest.yml') | from_yaml_all | list }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

# Wait for ArgoCD namespace and pods to be ready
- name: Wait for ArgoCD namespace
  kubernetes.core.k8s_info:
    kind: Namespace
    name: argocd
    wait: true
    wait_timeout: 60
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"
  register: namespace_check
  retries: 10
  delay: 6
  until: namespace_check.resources | length > 0

- name: Wait for ArgoCD server pod
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: argocd
    label_selectors:
      - app.kubernetes.io/name=argocd-server
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 300
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"
  register: pod_check
  retries: 30
  delay: 10
  until: pod_check.resources | length > 0 and pod_check.resources[0].status.phase == "Running"

- name: Wait for ArgoCD service
  kubernetes.core.k8s_info:
    kind: Service
    namespace: argocd
    name: argocd-server
    wait: true
    wait_timeout: 60
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"

- name: Patch ArgoCD service to LoadBalancer with pinned MetalLB IP
  # PIN the LoadBalancer IP via MetalLB annotations to whatever is in
  # vault_argocd_server_ip. Without this pin, MetalLB picks the next free
  # IP from the default pool every redeploy and the assigned IP can drift
  # away from what the vault var thinks. The drift silently breaks every
  # downstream `argocd login {{ argocd_server_ip }}` call (traefik,
  # forgejo, keycloak, vault, andusystems-* roles), making `apps.sh`
  # unusable until someone notices and updates the vault by hand.
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-server
        namespace: argocd
        annotations:
          metallb.io/address-pool: default
          metallb.io/loadBalancerIPs: "{{ argocd_server_ip }}"
      spec:
        type: LoadBalancer
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"

- name: Wait for LoadBalancer IP assignment
  kubernetes.core.k8s_info:
    kind: Service
    namespace: argocd
    name: argocd-server
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"
  register: argocd_service
  retries: 30
  delay: 5
  until: >-
    argocd_service.resources[0].status.loadBalancer.ingress is defined and
    argocd_service.resources[0].status.loadBalancer.ingress | length > 0

- name: Set ArgoCD server IP fact
  set_fact:
    argocd_server_ip: "{{ argocd_service.resources[0].status.loadBalancer.ingress[0].ip }}"

- name: Assert ArgoCD server IP is defined
  assert:
    that: argocd_server_ip is defined and argocd_server_ip | length > 0
    fail_msg: "LoadBalancer IP not yet assigned to argocd-server. Check MetalLB and retry."

# Probe via kube-apiserver, not the LoadBalancer IP. The LB IP is only
# reachable from the workstation through the Pangolin/Newt tunnel, which
# is installed later in deploy.yml — so a workstation-side HTTP probe
# can't succeed during bootstrap. argocd-server's readiness probe is the
# source of truth for API health; the deployment going Available means
# at least one replica passed it.
- name: Wait for ArgoCD server deployment to be Available
  command: >
    kubectl -n argocd wait deployment/argocd-server
    --for=condition=Available --timeout=300s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false

- name: Get ArgoCD initial admin secret (may be absent on re-runs)
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: argocd
    name: argocd-initial-admin-secret
  environment:
    KUBECONFIG: "{{ repo_root }}/kubeconfig"
  register: secret_info

- name: Decode initial ArgoCD password
  set_fact:
    argocd_initial_password: "{{ secret_info.resources[0].data.password | b64decode }}"
  when: secret_info.resources | length > 0
  no_log: true

# Install ArgoCD CLI if not present
- name: Check if argocd CLI is installed
  command: which argocd
  register: argocd_cli_check
  ignore_errors: true
  changed_when: false

- name: Download and install argocd CLI
  get_url:
    url: https://github.com/argoproj/argo-cd/releases/download/v2.12.0/argocd-linux-amd64
    dest: /usr/local/bin/argocd
    mode: '0755'
  when: argocd_cli_check.rc != 0

# --- Log in with fallback: try initial-secret password, then vault password ---
- name: Try login with initial-secret ArgoCD password
  shell: |
    argocd login {{ argocd_server_ip }} \
      --username admin \
      --password {{ argocd_initial_password | quote }} \
      --insecure \
      --plaintext
  register: initial_login
  failed_when: false
  changed_when: "'logged in successfully' in initial_login.stdout"
  environment:
    ARGOCD_OPTS: "--grpc-web"
  when: argocd_initial_password is defined
  no_log: true

- name: Try login with vault ArgoCD password (fallback for re-runs)
  shell: |
    argocd login {{ argocd_server_ip }} \
      --username admin \
      --password {{ argocd_admin_password | quote }} \
      --insecure \
      --plaintext
  register: vault_login
  failed_when: false
  changed_when: "'logged in successfully' in vault_login.stdout"
  until: vault_login.rc == 0
  retries: 5
  delay: 10
  environment:
    ARGOCD_OPTS: "--grpc-web"
  when: (initial_login.rc | default(1)) != 0
  no_log: true

- name: Record which ArgoCD password is active
  set_fact:
    argocd_initial_password_active: "{{ (initial_login.rc | default(1)) == 0 }}"
    login_result:
      rc: 0
  when: (initial_login.rc | default(1)) == 0 or (vault_login.rc | default(1)) == 0

- name: Fail if neither ArgoCD password worked
  fail:
    msg: "Could not log in to ArgoCD with either the initial-secret password or vault argocd_admin_password"
  when: login_result is not defined
