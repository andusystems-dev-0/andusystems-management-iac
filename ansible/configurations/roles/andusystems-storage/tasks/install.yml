---
- name: Login to ArgoCD
  # argv form keeps the password out of the shell parser (and shells history)
  # but it is still visible in /proc/<pid>/cmdline while the process runs.
  # Acceptable on this ephemeral runner; bump the argocd CLI in the runner
  # image to >= 2.14 to use --password-stdin and drop this entirely.
  ansible.builtin.command:
    argv:
      - argocd
      - login
      - "{{ argocd_server_ip }}"
      - --username
      - admin
      - --password
      - "{{ argocd_admin_password }}"
      - --insecure
      - --plaintext
  register: login_result
  changed_when: "'logged in successfully' in login_result.stdout"
  until: login_result.rc == 0
  retries: 5
  delay: 10
  environment:
    ARGOCD_OPTS: "--grpc-web"
  no_log: true

# Install storage cluster apps
- name: install | Install storage Cluster Apps
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', repo_root + '/apps/andusystems-storage/manifest.yml') | from_yaml_all | list }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"