---
#<REMOVED BY SENTINEL BOT: SECRET — secret or credential detected><REMOVED BY SENTINEL BOT: SECRET — secret or credential detected><REMOVED BY SENTINEL BOT: SECRET — secret or credential detected><REMOVED BY SENTINEL BOT: SECRET — secret or credential detected><REMOVED BY SENTINEL BOT: SECRET — secret or credential detected><REMOVED BY SENTINEL BOT: SECRET — secret or credential detected><REMOVED BY SENTINEL BOT: SECRET — secret or credential detected><REMOVED BY SENTINEL BOT: SECRET — secret or credential detected><REMOVED BY SENTINEL BOT: SECRET — secret or credential detected><REMOVED BY SENTINEL BOT: SECRET — secret or credential detected><REMOVED BY SENTINEL BOT: SECRET — secret or credential detected><REMOVED BY SENTINEL BOT: SECRET — secret or credential detected>te the Kubernetes namespace and seed it with secrets needed by the Forgejo deployment.
- name: Create forgejo namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: forgejo
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

# Store the admin credentials as a K8s secret so the Helm chart can configure
# the initial Forgejo admin account without exposing the password in values.yml.
- name: Create Forgejo admin secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: forgejo-admin-secret
        namespace: forgejo
      type: Opaque
      stringData:
        username: forgejo_admin
        password: "{{ forgejo_admin_password }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

# --- Helm deployment ---
# Install (or upgrade) Forgejo using the official OCI Helm chart with our custom values.
# Waits up to 10 minutes for all resources to become ready.
- name: Install Forgejo Helm chart
  command: >
    helm upgrade --install forgejo
    oci://code.forgejo.org/forgejo-helm/forgejo
    --namespace forgejo
    --values {{ repo_root }}/apps/forgejo/values.yml
    --wait
    --timeout 10m
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: helm_install
  changed_when: "'has been upgraded' in helm_install.stdout or 'has been installed' in helm_install.stdout"

# Block until the Forgejo pod passes its readiness probe, so subsequent API
# calls don't race against a still-starting container.
- name: Wait for Forgejo pod to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: forgejo
    label_selectors:
      - app.kubernetes.io/name=forgejo
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 300
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

# --- Resolve the Forgejo in-cluster API endpoint ---
# Retrieve the ClusterIP so we can build an internal URL for API calls routed
# through the control plane node via SSH (the Ansible controller is on a
# different VLAN and cannot reach ClusterIPs directly).
- name: Get Forgejo ClusterIP
  command: >
    kubectl get svc forgejo-http -n forgejo
    -o jsonpath='{.spec.clusterIP}'
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: forgejo_cluster_ip
  changed_when: false

- name: Set Forgejo API base URL (via control plane)
  set_fact:
    forgejo_internal_url: "http://{{ forgejo_cluster_ip.stdout }}:3000"

# Poll the Forgejo API through the control plane until it responds successfully.
# The pod may be ready before the HTTP server finishes its first-run migrations.
- name: Wait for Forgejo API to be responsive (via control plane)
  command: >
    ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_user }}@{{ control_plane_ip }}
    curl -sf {{ forgejo_internal_url }}/api/v1/settings/api
  register: api_check
  until: api_check.rc == 0
  retries: 30
  delay: 5
  changed_when: false

# --- Organization setup ---
# Ensure the "andusystems" organization exists. All IaC repos and team
# memberships are scoped under this org.
- name: Check if andusystems org exists
  command: >
    ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_user }}@{{ control_plane_ip }}
    curl -sf -o /dev/null -w '%{http_code}'
    -u 'forgejo_admin:{{ forgejo_admin_password }}'
    {{ forgejo_internal_url }}/api/v1/orgs/andusystems
  register: org_check
  changed_when: false
  failed_when: false

- name: Create andusystems org
  shell: >
    ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_user }}@{{ control_plane_ip }}
    'curl -sf -X POST
    -u "forgejo_admin:{{ forgejo_admin_password }}"
    -H "Content-Type: application/json"
    -d "{\"username\":\"andusystems\",\"full_name\":\"Andusystems\",\"visibility\":\"public\"}"
    {{ forgejo_internal_url }}/api/v1/orgs'
  when: org_check.stdout != '200'

# --- Create service and operator users ---
# Provision the "sentinel" service account (used by CI/CD automation) and the
# human operator account. Both are added to the andusystems Owners team so they
# have full access to all org repos.
- name: Define Forgejo users to create
  set_fact:
    forgejo_users:
      - username: "sentinel"
        email: "{{ forgejo_sentinel_email }}"
        password: "{{ forgejo_sentinel_password }}"
        full_name: "Sentinel"
      - username: "{{ forgejo_alex_username }}"
        email: "{{ forgejo_alex_email }}"
        password: "{{ forgejo_alex_password }}"
        full_name: "Alex"

- name: Check if Forgejo user exists
  shell: >
    ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_user }}@{{ control_plane_ip }}
    'curl -sf -o /dev/null -w "%{http_code}"
    -u "forgejo_admin:{{ forgejo_admin_password }}"
    {{ forgejo_internal_url }}/api/v1/users/{{ item.username }}'
  register: user_check
  loop: "{{ forgejo_users }}"
  loop_control:
    label: "{{ item.username }}"
  changed_when: false
  failed_when: false

- name: Create Forgejo user via admin API
  shell: >
    ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_user }}@{{ control_plane_ip }}
    'curl -sf -X POST
    -u "forgejo_admin:{{ forgejo_admin_password }}"
    -H "Content-Type: application/json"
    -d "{\"username\":\"{{ item.item.username }}\",\"email\":\"{{ item.item.email }}\",\"password\":\"{{ item.item.password }}\",\"full_name\":\"{{ item.item.full_name }}\",\"must_change_password\":false,\"send_notify\":false}"
    {{ forgejo_internal_url }}/api/v1/admin/users'
  loop: "{{ user_check.results }}"
  loop_control:
    label: "{{ item.item.username }}"
  when: item.stdout != '200'
  no_log: true

# Look up the Owners team ID so we can add users to it in the next step.
- name: Get andusystems org Owners team ID
  shell: >
    ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_user }}@{{ control_plane_ip }}
    'curl -sf
    -u "forgejo_admin:{{ forgejo_admin_password }}"
    {{ forgejo_internal_url }}/api/v1/orgs/andusystems/teams/search?q=Owners'
  register: owners_team_result
  changed_when: false

- name: Extract Owners team ID
  set_fact:
    owners_team_id: "{{ (owners_team_result.stdout | from_json).data[0].id }}"

- name: Add users to andusystems Owners team
  shell: >
    ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_user }}@{{ control_plane_ip }}
    'curl -sf -X PUT
    -u "forgejo_admin:{{ forgejo_admin_password }}"
    -o /dev/null -w "%{http_code}"
    {{ forgejo_internal_url }}/api/v1/teams/{{ owners_team_id }}/members/{{ item.username }}'
  loop: "{{ forgejo_users }}"
  loop_control:
    label: "{{ item.username }}"
  register: team_add_result
  changed_when: team_add_result.stdout == '204'
  failed_when: team_add_result.stdout not in ['204', '200']

# --- Create all IaC repos under the andusystems org ---
# Each VLAN-specific cluster has its own IaC repo. These are created as public
# repos under the andusystems org so ArgoCD and developers can access them.
- name: Define IaC repos to create on Forgejo
  set_fact:
    forgejo_iac_repos:
      - name: "andusystems-management"
        description: "Management cluster IaC (VLAN 10)"
      - name: "andusystems-monitoring"
        description: "Monitoring cluster IaC (VLAN 50)"
      - name: "andusystems-networking"
        description: "Networking cluster IaC (VLAN 30)"
      - name: "andusystems-storage"
        description: "Storage cluster IaC (VLAN 40)"
      - name: "andusystems-portfolio"
        description: "Portfolio cluster IaC"
      - name: "andusystems-hireship"
        description: "Hireship sit + prod cluster IaC"

- name: Check if Forgejo IaC repo exists
  shell: >
    ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_user }}@{{ control_plane_ip }}
    'curl -sf -o /dev/null -w "%{http_code}"
    -u "forgejo_admin:{{ forgejo_admin_password }}"
    {{ forgejo_internal_url }}/api/v1/repos/andusystems/{{ item.name }}'
  register: iac_repo_check
  loop: "{{ forgejo_iac_repos }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  failed_when: false

- name: Create Forgejo IaC repo
  shell: >
    ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_user }}@{{ control_plane_ip }}
    'curl -sf -X POST
    -u "forgejo_admin:{{ forgejo_admin_password }}"
    -H "Content-Type: application/json"
    -d "{\"name\":\"{{ item.item.name }}\",\"description\":\"{{ item.item.description }}\",\"private\":false,\"auto_init\":false}"
    {{ forgejo_internal_url }}/api/v1/orgs/andusystems/repos'
  loop: "{{ iac_repo_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stdout != '200'

# --- Push this management repo to Forgejo ---
# Add (or update) a "forgejo" git remote on the local clone and push the full
# history to Forgejo via a git bundle transferred through the control plane.
# This bootstraps the management repo content on the newly deployed Forgejo
# instance so ArgoCD can begin syncing from it.
- name: Check if forgejo git remote exists
  command: git -C {{ repo_root }} remote get-url forgejo
  register: remote_check
  failed_when: false
  changed_when: false

- name: Add forgejo git remote (public URL, no embedded creds)
  command: >
    git -C {{ repo_root }} remote add forgejo
    https://forgejo.andusystems.com/andusystems/andusystems-management.git
  when: remote_check.rc != 0

- name: Update forgejo git remote URL (public URL, no embedded creds)
  command: >
    git -C {{ repo_root }} remote set-url forgejo
    https://forgejo.andusystems.com/andusystems/andusystems-management.git
  when: remote_check.rc == 0

- name: Push management repo to Forgejo (via control plane as git proxy)
  shell: |
    cd {{ repo_root }}
    git bundle create /tmp/management-repo.bundle --all
    scp -i {{ ssh_key_path }} -o StrictHostKeyChecking=no /tmp/management-repo.bundle {{ ssh_user }}@{{ control_plane_ip }}:/tmp/
    ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_user }}@{{ control_plane_ip }} bash -c '
      cd /tmp &&
      git clone management-repo.bundle management-repo &&
      cd management-repo &&
      git remote add forgejo http://forgejo_admin:{{ forgejo_admin_password }}@{{ forgejo_cluster_ip.stdout }}:3000/andusystems/andusystems-management.git &&
      git push forgejo HEAD:main --force &&
      cd /tmp && rm -rf management-repo management-repo.bundle
    '
    rm -f /tmp/management-repo.bundle
  register: push_result
  changed_when: true

# --- Push spoke cluster repos to Forgejo ---
# The forgejo_iac_repos creation loop above creates EMPTY repos for every spoke
# cluster (storage, monitoring, networking, portfolio). ArgoCD's
# Application resources for those clusters reference forgejo via the multi-source
# `$values` ref pattern; without content in the repo, every spoke Application
# fails to render with "failed to get git client for repo".
#
# This block bundles each spoke cluster's local clone (assumed to live at
# /home/admin/andusystems/<repo-name>) and pushes the full history to its
# now-empty Forgejo repo, using the same control-plane git-proxy pattern as
# the management push above. Local clones that don't exist on the workstation
# are gracefully skipped — re-run after cloning to populate them later.
- name: Define spoke cluster repos to push to Forgejo
  set_fact:
    forgejo_spoke_repos:
      - { name: andusystems-monitoring,  path: /home/admin/andusystems/andusystems-monitoring  }
      - { name: andusystems-networking,  path: /home/admin/andusystems/andusystems-networking  }
      - { name: andusystems-storage,     path: /home/admin/andusystems/andusystems-storage     }
      - { name: andusystems-portfolio,   path: /home/admin/andusystems/andusystems-portfolio   }
      - { name: andusystems-hireship,    path: /home/admin/andusystems/andusystems-hireship    }

- name: Check if spoke cluster local clones exist
  stat:
    path: "{{ item.path }}/.git"
  loop: "{{ forgejo_spoke_repos }}"
  loop_control:
    label: "{{ item.name }}"
  register: spoke_clone_check

- name: Push spoke cluster repos to Forgejo (via control plane as git proxy)
  shell: |
    set -e
    cd {{ item.item.path }}
    git bundle create /tmp/{{ item.item.name }}.bundle --all
    scp -i {{ ssh_key_path }} -o StrictHostKeyChecking=no /tmp/{{ item.item.name }}.bundle \
        {{ ssh_user }}@{{ control_plane_ip }}:/tmp/
    ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_user }}@{{ control_plane_ip }} bash -c '
      set -e
      cd /tmp && rm -rf {{ item.item.name }}-repo
      git clone {{ item.item.name }}.bundle {{ item.item.name }}-repo
      cd {{ item.item.name }}-repo
      git remote add forgejo http://forgejo_admin:{{ forgejo_admin_password }}@{{ forgejo_cluster_ip.stdout }}:3000/andusystems/{{ item.item.name }}.git
      git push forgejo HEAD:main --force
      cd /tmp && rm -rf {{ item.item.name }}-repo {{ item.item.name }}.bundle
    '
    rm -f /tmp/{{ item.item.name }}.bundle
  loop: "{{ spoke_clone_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.exists and item.stat.isdir
  changed_when: true

# --- Push extra (non-cluster-IaC) repos to Forgejo ---
# These repos are not cluster IaC and therefore aren't part of forgejo_iac_repos
# (which drives the ArgoCD repo registration loop below). They live on Forgejo
# purely so the homelab has a single internal source of truth — dotfiles, the
# Sentinel SDLC engine, and the Portfolio app. The repo NAME is what shows up
# in Forgejo under the andusystems org; case is preserved (note the capital
# "P" in Portfolio, which is distinct from the lowercase andusystems-portfolio
# spoke cluster repo above).
#
# This block: (1) creates the empty Forgejo repo if missing, (2) stats the
# local clone, (3) bundles and pushes via the same control-plane git-proxy
# pattern as the spoke push above. Missing local clones are skipped — re-run
# after cloning the repo locally to populate it.
- name: Define extra repos to push to Forgejo
  set_fact:
    forgejo_extra_repos:
      - name: andusystems-arch
        description: "Arch Linux dotfiles and workstation config"
        path: /home/admin/andusystems/andusystems-arch
      - name: andusystems-sentinel
        description: "Sentinel autonomous SDLC engine"
        path: /home/admin/andusystems/andusystems-sentinel
      - name: Hireship
        description: "Hireship application (Rust API + SvelteKit)"
        path: /home/admin/andusystems/Hireship
      - name: Portfolio
        description: "Portfolio application"
        path: /home/admin/andusystems/Portfolio
      - name: ops
        description: "Repo for handling Andusystems work, ops, and kanban"
        path: /home/admin/andusystems/ops

- name: Check if extra Forgejo repo exists
  shell: >
    ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_user }}@{{ control_plane_ip }}
    'curl -sf -o /dev/null -w "%{http_code}"
    -u "forgejo_admin:{{ forgejo_admin_password }}"
    {{ forgejo_internal_url }}/api/v1/repos/andusystems/{{ item.name }}'
  register: extra_repo_check
  loop: "{{ forgejo_extra_repos }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  failed_when: false

- name: Create extra Forgejo repo
  shell: >
    ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_user }}@{{ control_plane_ip }}
    'curl -sf -X POST
    -u "forgejo_admin:{{ forgejo_admin_password }}"
    -H "Content-Type: application/json"
    -d "{\"name\":\"{{ item.item.name }}\",\"description\":\"{{ item.item.description }}\",\"private\":false,\"auto_init\":false}"
    {{ forgejo_internal_url }}/api/v1/orgs/andusystems/repos'
  loop: "{{ extra_repo_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stdout != '200'

- name: Check if extra repo local clones exist
  stat:
    path: "{{ item.path }}/.git"
  loop: "{{ forgejo_extra_repos }}"
  loop_control:
    label: "{{ item.name }}"
  register: extra_clone_check

- name: Push extra repos to Forgejo (via control plane as git proxy)
  shell: |
    set -e
    cd {{ item.item.path }}
    git bundle create /tmp/{{ item.item.name }}.bundle --all
    scp -i {{ ssh_key_path }} -o StrictHostKeyChecking=no /tmp/{{ item.item.name }}.bundle \
        {{ ssh_user }}@{{ control_plane_ip }}:/tmp/
    ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_user }}@{{ control_plane_ip }} bash -c '
      set -e
      cd /tmp && rm -rf {{ item.item.name }}-repo
      git clone {{ item.item.name }}.bundle {{ item.item.name }}-repo
      cd {{ item.item.name }}-repo
      git remote add forgejo http://forgejo_admin:{{ forgejo_admin_password }}@{{ forgejo_cluster_ip.stdout }}:3000/andusystems/{{ item.item.name }}.git
      git push forgejo HEAD:main --force
      cd /tmp && rm -rf {{ item.item.name }}-repo {{ item.item.name }}.bundle
    '
    rm -f /tmp/{{ item.item.name }}.bundle
  loop: "{{ extra_clone_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.exists and item.stat.isdir
  changed_when: true

# --- Create kanban Project on ops repo ---
# The ops repo carries our day-to-day kanban. Create a basic_kanban Project
# (To Do / In Progress / Done columns) via the Forgejo Projects API. This is
# best-effort: the API surface for projects has shifted across Forgejo
# versions, so a non-2xx response is logged but does not fail the play. If it
# fails, create the Project manually via the Forgejo UI on the ops repo.
- name: Check existing Projects on ops repo
  shell: >
    ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_user }}@{{ control_plane_ip }}
    'curl -sf
    -u "forgejo_admin:{{ forgejo_admin_password }}"
    {{ forgejo_internal_url }}/api/v1/repos/andusystems/ops/projects'
  register: ops_projects_check
  changed_when: false
  failed_when: false

- name: Create kanban Project on ops repo
  shell: >
    ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_user }}@{{ control_plane_ip }}
    'curl -s -o /dev/null -w "%{http_code}" -X POST
    -u "forgejo_admin:{{ forgejo_admin_password }}"
    -H "Content-Type: application/json"
    -d "{\"title\":\"Ops\",\"description\":\"Andusystems ops kanban\",\"board_type\":\"basic_kanban\"}"
    {{ forgejo_internal_url }}/api/v1/repos/andusystems/ops/projects'
  register: ops_project_create
  changed_when: ops_project_create.stdout in ['200', '201']
  failed_when: false
  when: ops_projects_check.stdout is not defined or '"title":"Ops"' not in (ops_projects_check.stdout | default(''))

- name: Note if kanban Project creation failed
  debug:
    msg: "Kanban Project create returned HTTP {{ ops_project_create.stdout | default('n/a') }} — if not 200/201, create it manually in the Forgejo UI on the ops repo."
  when:
    - ops_project_create is defined
    - ops_project_create.stdout is defined
    - ops_project_create.stdout not in ['200', '201']

# --- Register repos with ArgoCD ---
# Authenticate with ArgoCD and register every IaC repo so ArgoCD can monitor
# them for changes and reconcile the declared state.
- name: Log in to ArgoCD (for repo registration)
  shell: |
    argocd login {{ argocd_server_ip }} \
      --username admin \
      --password {{ argocd_admin_password | quote }} \
      --insecure \
      --plaintext
  register: argocd_login
  changed_when: "'logged in successfully' in argocd_login.stdout"
  environment:
    ARGOCD_OPTS: "--grpc-web"
  no_log: true

- name: Register all Forgejo IaC repos in ArgoCD
  shell: |
    argocd repo add http://forgejo-http.forgejo.svc.cluster.local:3000/andusystems/{{ item.name }}.git \
      --upsert
  loop: "{{ forgejo_iac_repos }}"
  loop_control:
    label: "{{ item.name }}"
  register: argocd_repo
  changed_when: '"already exists" not in argocd_repo.stdout'
  # Empty repos cause argocd CLI's connectivity check (ls-remote HEAD) to fail.
  # That's expected on first bootstrap — non-management repos have no commits
  # yet. Treat "remote repository is empty" as success; the user will push
  # content to each repo from its local clone and re-register later.
  failed_when:
    - argocd_repo.rc != 0
    - "'remote repository is empty' not in argocd_repo.stderr"

# --- Post-install summary ---
# Print connection details and a reminder to generate a sentinel PAT.
- name: Display Forgejo info
  debug:
    msg:
      - "Forgejo is running (ClusterIP: {{ forgejo_cluster_ip.stdout }}:3000)"
      - "Public URL: https://forgejo.andusystems.com"
      - "Admin: forgejo_admin"
      - "IaC repos created: {{ forgejo_iac_repos | map(attribute='name') | list | join(', ') }}"
      - "Extra repos created: {{ forgejo_extra_repos | map(attribute='name') | list | join(', ') }}"
      - "Users created: sentinel, {{ forgejo_alex_username }}"
      - "Management repo pushed to Forgejo"
      - "Reminder: generate a new sentinel PAT via Forgejo UI after deploy, then update FORGEJO_SENTINEL_TOKEN in sentinel/.env"
      - "Reminder: if the ops kanban Project did not auto-create, add it manually via the Forgejo UI on the ops repo."
