---
- name: Create newt namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: newt
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

- name: Apply newt credentials secret
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', repo_root + '/apps/pangolin-newt/manifest.yml') | from_yaml_all | list }}"
  register: newt_secret_apply
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

# Newt reads the endpoint/id/secret from this Secret at startup only; a
# Secret edit doesn't propagate to running pods. If we just rewrote the
# Secret, find any Newt deployments and rollout-restart them so they pick
# up the new values. On first install the deployment doesn't exist yet
# (ArgoCD hasn't synced the Helm chart), so the lookup is empty and this
# is a no-op — only meaningful on re-runs after a vault edit.
- name: Find existing Newt deployments (if any)
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: newt
    label_selectors:
      - "app.kubernetes.io/name=newt"
  register: newt_deployments
  when: newt_secret_apply.changed
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

- name: Rollout-restart Newt deployments to reload Secret
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: Deployment
    namespace: newt
    name: "{{ item.metadata.name }}"
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ ansible_date_time.iso8601 }}"
  loop: "{{ newt_deployments.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when:
    - newt_secret_apply.changed
    - newt_deployments.resources | default([]) | length > 0
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

- name: install | Install Newt ArgoCD Application
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: management-newt
        namespace: argocd
      spec:
        project: default
        sources:
          - repoURL: https://charts.fossorial.io
            chart: newt
            targetRevision: 1.3.0
            helm:
              valueFiles:
                - $values/apps/pangolin-newt/values.yml
          - repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/andusystems/andusystems-management.git
            targetRevision: HEAD
            ref: values
        destination:
          name: in-cluster
          namespace: newt
        syncPolicy:
          automated:
            prune: false
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
