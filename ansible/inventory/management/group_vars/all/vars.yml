---
# Repository and paths
repo_root: "{{ vault_repo_root }}"
tfvars_file: "{{ vault_tfvars_file }}"
apps_dir: "{{ vault_apps_dir }}"

# SSH connection settings
ssh_user: "{{ vault_ssh_user }}"  # e.g., "ubuntu", "admin"
ssh_key_path: "{{ vault_ssh_key_path }}"  # e.g., "/home/user/.ssh/id_rsa"

# Terraform outputs (will be populated dynamically)
control_plane_ip: "{{ vault_control_plane_ip }}"
worker_ips: "{{ vault_worker_ips }}"
vm_ips: "{{ vault_vm_ips }}"

# Kubernetes settings
kubernetes_version: "{{ vault_kubernetes_version }}"
pod_network_cidr: "{{ vault_pod_network_cidr }}"

# SSH connection retry settings
ssh_max_retries: "{{ vault_ssh_max_retries }}"
ssh_retry_delay: "{{ vault_ssh_retry_delay }}"
ssh_connect_timeout: "{{ vault_ssh_connect_timeout }}"
ssh_strict_host_key_checking: "{{ vault_ssh_strict_host_key_checking }}"

# SSH options (constructed from above settings)
# Note: This will be built dynamically in the playbook
ssh_common_args: "{{ vault_ssh_common_args }}"

# Kubeconfig path
kubeconfig: "{{ vault_kubeconfig }}"
monitoring_kubeconfig: "{{ vault_monitoring_kubeconfig }}"
fleetdock_kubeconfig: "{{ vault_fleetdock_kubeconfig }}"
networking_kubeconfig: "{{ vault_networking_kubeconfig }}"

# Join command (will be populated during runtime)
join_command: "{{ vault_join_command }}"

#cloudflare api token for tls certs
cloudflare_api_token: "{{ vault_cloudflare_api_token }}"

homepage_url: "{{ vault_homepage_url }}"

metallb_ip_range: "{{ vault_metallb_ip_range }}"

argocd_server_ip: "{{ vault_argocd_server_ip }}"
argocd_url: "{{ vault_argocd_url }}"
argocd_admin_password: "{{ vault_argocd_admin_password }}"

management_traefik_server_ip: "{{ vault_management_traefik_server_ip }}"
monitoring_traefik_server_ip: "{{ vault_monitoring_traefik_server_ip }}"
fleetdock_traefik_server_ip: "{{ vault_fleetdock_traefik_server_ip }}"
networking_traefik_server_ip: "{{ vault_networking_traefik_server_ip }}"
storage_traefik_server_ip: "{{ vault_storage_traefik_server_ip }}"

management_ssh_private_key_path: "{{ vault_management_ssh_private_key_path }}"
monitoring_ssh_private_key_path: "{{ vault_monitoring_ssh_private_key_path }}"
andusystems_fleetdock_ssh_private_key_path: "{{ vault_andusystems_fleetdock_ssh_private_key_path }}"
fleetdock_ssh_private_key_path: "{{ vault_fleetdock_ssh_private_key_path }}"
networking_ssh_private_key_path: "{{ vault_networking_ssh_private_key_path }}"
storage_ssh_private_key_path: "{{ vault_storage_ssh_private_key_path }}"

storage_kubeconfig: "{{ vault_storage_kubeconfig }}"

# Let's Encrypt
letsencrypt_email: "{{ vault_letsencrypt_email }}"

# Keycloak settings
keycloak_admin_user: "{{ vault_keycloak_admin_user }}"
keycloak_admin_password: "{{ vault_keycloak_admin_password }}"
keycloak_url: "{{ vault_keycloak_url }}"
grafana_oidc_client_secret: "{{ vault_grafana_oidc_client_secret }}"

# Forgejo
forgejo_admin_password: "{{ vault_forgejo_admin_password }}"
forgejo_url: "{{ vault_forgejo_url }}"
forgejo_sentinel_password: "{{ vault_forgejo_sentinel_password }}"
forgejo_sentinel_email: "{{ vault_forgejo_sentinel_email }}"
forgejo_alex_username: "{{ vault_forgejo_alex_username }}"
forgejo_alex_password: "{{ vault_forgejo_alex_password }}"
forgejo_alex_email: "{{ vault_forgejo_alex_email }}"

# HashiCorp Vault
vault_url: "{{ vault_vault_url }}"

# Pangolin/Newt
pangolin_endpoint: "{{ vault_pangolin_endpoint }}"
newt_id: "{{ vault_newt_id }}"
newt_secret: "{{ vault_newt_secret }}"

minio_root_user: "{{ vault_minio_root_user }}"
minio_root_password: "{{ vault_minio_root_password }}"

# Slimerio cluster
slimerio_repo_root: "{{ vault_slimerio_repo_root }}"
slimerio_kubeconfig: "{{ vault_slimerio_kubeconfig }}"
slimerio_ssh_private_key_path: "{{ vault_slimerio_ssh_private_key_path }}"
slimerio_traefik_server_ip: "{{ vault_slimerio_traefik_server_ip }}"

# Portfolio cluster
portfolio_repo_root: "{{ vault_portfolio_repo_root }}"
portfolio_kubeconfig: "{{ vault_portfolio_kubeconfig }}"

# GitHub Actions Runner (repo-scoped — see apps/github-runner/values-runner.yml)
github_runner_pat: "{{ vault_github_runner_pat }}"
github_runner_repo: "{{ vault_github_runner_repo }}"